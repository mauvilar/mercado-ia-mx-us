[project]
name = "mercado-ia-mx-us"
version = "0.1.0"
description = "Mercado de trabajo de IA: México vs Estados Unidos"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
authors = [{ name = "Mau Vilar", email = "unicemau@gmail.com" }]

dependencies = [
    "pandas>=2.2,<2.3",
    "numpy>=1.26,<2.2",
    "scipy>=1.13,<1.15",
    "scikit-learn>=1.5,<1.6",
    "requests>=2.32,<3.0",
    "pyarrow>=17.0,<19.0",
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.7,<0.9",
    "mypy>=1.13,<2.0",
    "pandas-stubs>=2.2,<2.3",
    "types-requests>=2.32,<3.0",
    "types-PyYAML>=6.0,<7.0",
]
notebook = [
    "jupyterlab>=4.3,<5.0",
    "ipykernel>=6.29,<7.0",
    "matplotlib>=3.9,<4.0",
    "seaborn>=0.13,<0.14",
    "nbconvert>=7.16,<8.0",
]

[project.scripts]
mia-collect = "src.data.collect:main"
mia-build = "src.features.build:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
